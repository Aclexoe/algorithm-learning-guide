<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2454A6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFF"/>
  <text x="600" y="45" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#123E7C" text-anchor="middle">动态规划的状态转移思路</text>
<rect x="95" y="120" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="180" y="155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">定义状态</text>
<text x="180" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">dp[i] 表示什么？</text>
<line x1="265" y1="168" x2="315" y2="168" stroke="#2454A6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="315" y="120" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="400" y="155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">边界条件</text>
<text x="400" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">dp[0], dp[1]</text>
<line x1="485" y1="168" x2="535" y2="168" stroke="#2454A6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="535" y="120" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="620" y="155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">状态转移</text>
<text x="620" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">dp[i] = f(...)</text>
<line x1="705" y1="168" x2="755" y2="168" stroke="#2454A6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="755" y="120" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="840" y="155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">计算顺序</text>
<text x="840" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">从小问题到大问题</text>
<line x1="925" y1="168" x2="975" y2="168" stroke="#2454A6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="975" y="120" width="170" height="95" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="1060" y="155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">返回答案</text>
<text x="1060" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">dp[n] 或最优值</text>
<rect x="190" y="290" width="820" height="110" rx="14" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="325" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F6B42" text-anchor="middle">例：斐波那契数列</text>
<text x="600" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" fill="#334155" text-anchor="middle">dp[i] = dp[i-1] + dp[i-2]，即当前项由前两项共同推出</text>
<text x="600" y="385" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="middle">0, 1, 1, 2, 3, 5, 8, 13, ...</text>
</svg>