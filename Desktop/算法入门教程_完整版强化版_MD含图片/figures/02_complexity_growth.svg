<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2454A6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFF"/>
  <text x="560" y="45" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#123E7C" text-anchor="middle">常见时间复杂度增长趋势</text>
<line x1="90" y1="360" x2="1030" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90" y1="360" x2="90" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1045" y="365" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="middle">n</text>
<text x="72" y="75" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="middle">操作次数</text>
<polyline points="100,310 1000,310" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="315" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="start">O(1)</text>
<polyline points="100,295 300,275 520,255 760,240 1000,230" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="235" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#059669" text-anchor="start">O(log n)</text>
<polyline points="100,330 1000,120" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#D97706" text-anchor="start">O(n)</text>
<polyline points="100,335 300,290 520,230 760,160 1000,90" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1030" y="95" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#7C3AED" text-anchor="start">O(n log n)</text>
<polyline points="100,350 260,320 430,255 600,165 760,85" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="790" y="90" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="start">O(n²)</text>
<text x="560" y="405" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#334155" text-anchor="middle">读图方法：输入规模越大，曲线越陡的算法越容易超时。</text>
</svg>