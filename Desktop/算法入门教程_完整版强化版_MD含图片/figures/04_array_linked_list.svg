<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2454A6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFF"/>
  <text x="600" y="45" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#123E7C" text-anchor="middle">数组与链表的存储差异</text>
<text x="120" y="105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="start">数组：连续内存，按索引直接访问</text>
<rect x="130" y="130" width="80" height="55" rx="6" fill="#EAF2FF" stroke="#2454A6" stroke-width="2"/>
<text x="170" y="165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">10</text>
<text x="170" y="205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">[0]</text>
<rect x="230" y="130" width="80" height="55" rx="6" fill="#EAF2FF" stroke="#2454A6" stroke-width="2"/>
<text x="270" y="165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">20</text>
<text x="270" y="205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">[1]</text>
<rect x="330" y="130" width="80" height="55" rx="6" fill="#EAF2FF" stroke="#2454A6" stroke-width="2"/>
<text x="370" y="165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">30</text>
<text x="370" y="205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">[2]</text>
<rect x="430" y="130" width="80" height="55" rx="6" fill="#EAF2FF" stroke="#2454A6" stroke-width="2"/>
<text x="470" y="165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">40</text>
<text x="470" y="205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">[3]</text>
<rect x="530" y="130" width="80" height="55" rx="6" fill="#EAF2FF" stroke="#2454A6" stroke-width="2"/>
<text x="570" y="165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">50</text>
<text x="570" y="205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="middle">[4]</text>
<line x1="370" y1="230" x2="370" y2="195" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370" y="255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#D97706" text-anchor="middle">arr[2] 可直接定位</text>
<text x="120" y="320" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0F6B42" text-anchor="start">链表：节点分散，通过指针逐个连接</text>
<rect x="120" y="345" width="95" height="60" rx="10" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="155" y="382" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">10</text>
<line x1="190" y1="375" x2="235" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="215" y1="375" x2="300" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="345" width="95" height="60" rx="10" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="335" y="382" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">20</text>
<line x1="370" y1="375" x2="415" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="395" y1="375" x2="480" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="480" y="345" width="95" height="60" rx="10" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="515" y="382" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">30</text>
<line x1="550" y1="375" x2="595" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="575" y1="375" x2="660" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="345" width="95" height="60" rx="10" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="695" y="382" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">40</text>
<line x1="730" y1="375" x2="775" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<text x="870" y="380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="normal" fill="#64748B" text-anchor="middle">None</text>
<text x="600" y="460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="normal" fill="#334155" text-anchor="middle">数组适合频繁访问；链表适合频繁插入和删除。</text>
</svg>