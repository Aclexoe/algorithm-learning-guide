<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2454A6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#F8FAFF"/>
  <text x="600" y="45" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#123E7C" text-anchor="middle">如何选择搜索算法</text>
<rect x="480" y="85" width="240" height="60" rx="14" fill="#FFFFFF" stroke="#123E7C" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="122" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">数据是否有序？</text>
<line x1="520" y1="145" x2="360" y2="210" stroke="#2454A6" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="145" x2="840" y2="210" stroke="#2454A6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="210" width="240" height="60" rx="14" fill="#EAF2FF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="360" y="247" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">无序</text>
<rect x="720" y="210" width="240" height="60" rx="14" fill="#EAFBF1" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="840" y="247" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">有序</text>
<line x1="360" y1="270" x2="360" y2="330" stroke="#2454A6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="330" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#2454A6" stroke-width="2" filter="url(#shadow)"/>
<text x="360" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123E7C" text-anchor="middle">线性搜索</text>
<text x="360" y="386" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">简单但 O(n)</text>
<line x1="840" y1="270" x2="840" y2="330" stroke="#2454A6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="330" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<text x="840" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0F6B42" text-anchor="middle">二分搜索</text>
<text x="840" y="386" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">每次折半 O(log n)</text>
<rect x="480" y="450" width="240" height="70" rx="14" fill="#FFF4E6" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#B45309" text-anchor="middle">频繁查找？</text>
<text x="600" y="505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">可建立哈希表，平均 O(1)</text>
<line x1="480" y1="365" x2="480" y2="480" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,5"/>
<line x1="720" y1="365" x2="720" y2="480" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,5"/>
</svg>